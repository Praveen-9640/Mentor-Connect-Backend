spring.application.name=SpringSecurityMySqlAuthDemo

# Server port
server.port=8080

# Database configuration (TiDB Cloud, MySQL protocol)
# Credentials are read from environment variables only; no secrets are stored in this file.
# TLS: sslMode=VERIFY_CA validates the TiDB server certificate against the JVM truststore,
# which already trusts the public ISRG Root X1 CA. A copy of that public root certificate
# is kept at src/main/resources/db-ca/isrgrootx1.pem for reference / explicit pinning if needed.
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/mentorconnect?sslMode=VERIFY_CA}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437

# Resend email configuration (env vars only — no secrets in this file)
# RESEND_API_KEY=<set as environment variable>
# MAIL_FROM=<set as environment variable>

# Admin bootstrap
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
